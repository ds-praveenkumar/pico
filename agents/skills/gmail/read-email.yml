# Gmail Access

## Purpose
This skill lets pico read the master's Gmail inbox on demand — checking for
important mail, finding messages, and summarizing what arrived.

## When to use
- The master asks "check my email", "any unread mail?", or "read important emails".
- A task depends on a message pico needs to fetch (subject, sender, snippet).
- Summarizing recent mail into a short briefing.

## Integration status (wired)
- pico exposes Gmail tools over OAuth2 (the `agents.tools.gmail_oauth` client):
  - `gmail_list(query, unread_only, max_results)` — latest inbox messages.
  - `gmail_search(query, max_results)` — Gmail search syntax (e.g. `from:"x@y.com"`).
  - `gmail_read(message_id)` — full body of one message.
- Reads only; sending/marking require the master's explicit approval.

## Prerequisites
- OAuth2 client secrets configured (`GMAIL_CLIENT_SECRET_PATH` or
  `credentials.json`) and an authorized token (`token.json`).
- If the token is missing or expired, run
  `.venv/bin/python -m agents.tools.gmail_oauth` once to authenticate in a browser.
- If credentials are missing, the tools return "Gmail not configured."

## Input interface
| Parameter | Type | Required | Description |
| --- | --- | --- | --- |
| query | string | no | Gmail search expression (`gmail_list`/`gmail_search`). |
| unread_only | bool | no | Fetch only UNREAD messages (`gmail_list`). |
| max_results | int | no | Max messages to fetch (default 10). |
| message_id | string | yes | Gmail message ID (`gmail_read`). |

## Output interface
Each email is summarized as: `subject`, `from`, `date`, `snippet` (and ID,
which `gmail_read` needs).

## Steps to follow
1. **Confirm the ask** — what the master wants: latest mail, unread, or a search.
2. **Call the right tool** — `gmail_list` for recent/unread, `gmail_search`
   for a specific query, `gmail_read` for full content.
3. **Read the results** — pay attention to subjects and senders.
4. **Summarize** — a short briefing of what matters; ask before acting on any mail.
5. **Remember when useful** — save durable facts (e.g. "salary email arrived")
   with `memory_remember` or `semantic_remember`.

## Safety rules (non-negotiable)
- Reading only unless the master approves sending, marking, or anything else.
- Only the mail the master asked about; never unrelated inboxes or drafts.
- Secrets stay in `.env` or local OAuth files (git-ignored) and are never logged.
- Do not act on emails (pay, reply, click links) without the master's approval.