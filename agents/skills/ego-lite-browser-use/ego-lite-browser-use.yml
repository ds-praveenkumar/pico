# Ego-lite Browser Use

## Purpose
This skill teaches pico's researcher how to drive the ego-lite browser so it can
visit and search important websites on behalf of the master, {master}.

## When to use
- The master asks pico to open, search, or check a website.
- A task needs data that exists only behind a browser (login-gated or JS-heavy pages).
- Researching latest news, status pages, product pages, or documentation.

## Integration status (wired)
- The pico tool `ego_lite_browse_use` bridges Python to the `ego-browser` CLI
  (ego-lite browser). It validates the URL, runs a Node script in the ego-lite
  embedded runtime, and returns the page snapshot as plain text. One action per
  call: `load` (navigate + snapshot), `click` (use a snapshot `@ref`/`loc=`),
  `fill` (type into a field), `select` (pick a dropdown option), or `press` (send
  a key such as Enter to submit a form). The task
  space persists between calls so later actions see the previous page's state.
- Prerequisites on the machine: the **ego lite** browser app installed and
  running, and the `ego-browser` CLI on PATH. If the CLI is missing, pico reports
  "ego-browser CLI is not installed" and asks the master to install ego lite.
- The researcher selects this skill via the `skill_read` tool and drives the
  browser through the `ego_lite_browse_use` tool in its tool loop.

## Input interface
| Parameter | Type | Required | Description |
| --- | --- | --- | --- |
| url | string | no | http(s) URL to visit. Only http/https are allowed. Provide it on the first `load`; keep it on `click`/`fill`/`select`/`press` rounds. |
| action | string | yes | What to do this round: `load`, `click`, `fill`, `select`, `press` (send the `query` key, default Enter, to submit a form), `claim` (reclaim a handed-off tab after the master says they are done), or `release` (close the pico-owned task space once the goal is complete, freeing the browser claim for the next task). |
| selector | string | no | Stable selector for click/fill/select: the `loc=css:...` / `loc=role:...` / href text printed in the snapshot, a CSS selector, or `text=...`. Snapshot refs like `@5` only work in the very same call, not on pages opened later. |
| query | string | no | Text to type (`fill`), the option to pick (`select`), or the key to send (`press`, default Enter). |

## Output interface
| Parameter | Type | Description |
| --- | --- | --- |
| result | string | Plain-text page summary or extracted data folded into the task report. |
| need_human | object | Present when the page needs the master: `kind` is `captcha`, `otp`, `login`, or `form_input`. The browser window is open on that page and handed to the master — the tool announces what he must do and WAITS for him to hand control back; when he does, pico submits the form itself (CAPTCHA, OTP, and required-form pages; login pages stay read-only) and the result comes back with `resumed`/`submitted` and the result page snapshot. |
| paused | bool | Present (`true`) when the tab is parked under the master's control (the hand-off wait timed out or an earlier hand-off is open). Do not claim it on your own — ask via `ask_master` whether the master is done with it, then resume with `action='claim'`. |
| resumed | bool | Present and `true` when pico reclaimed the space after the master handed control back and read the result page. |
| submitted | object | What pico pressed after resuming: `how` is `click`, `enter`, or `skipped`; `selector` and `reason` give details (e.g. `login page: read only`, `auto-submit disabled`). |
| released | bool | Present on an `action='release'` call: `true` when the pico-owned task space was closed and the browser claim freed for the next task. |

## Steps to follow
1. **Validate** — confirm the URL is http(s) with a hostname; refuse everything else.
2. **Check the skill** — confirm the ego-lite browser engine is available
   (`list_skills` includes `ego-lite-browser-use`). If not, stop and ask the master.
3. **Open the browser** — start one ego-lite TaskSpace for the whole goal and
   navigate its first Page (`p1`) to the URL. The browser opens on the master's
   desktop so he can watch and take over at any time.
4. **Observe** — take one snapshot, read it, and choose the next action.
5. **Act and extract** — follow links, fill form fields, pick dropdown options,
   or `press` a key (e.g. Enter) to submit; collect content; use
   `page.evaluate()` to bulk-extract text on data-heavy pages.
6. **Wait for the result** — use `waitForSelector`/`waitForURL` instead of fixed
   sleeps; stop as soon as the page clearly shows the result.
7. **Humans only**: when a CAPTCHA, OTP, login, or required form appears, the
   tool hands the tab to the master, tells him what to do, and WAITS for him to
   hand control back — then pico submits the form itself (CAPTCHA/OTP/required
   fields) and reads the result page; never guess and never fill a CAPTCHA or
   OTP yourself. If the result is
   `paused` (the wait timed out), call `ask_master` and resume with
   `action='claim'` once he confirms he is done.
8. **Report** — return only a plain-text summary to pico, never raw DOM dumps.
9. **Clean up / release the claim** — once the goal is complete, call
   `ego_lite_browse_use` with `action='release'` exactly once (no `url` needed)
   so the pico-owned TaskSpace is closed and the browser claim is freed for the
   next task. Never release while a hand-off is pending (`need_human`/`paused`
   in the result) — the master still owns that tab.

## Browser interface (after wire-up)
Scripts run as `ego-browser nodejs` heredocs. Key APIs:
- `taskSpace(name)` — create one space per goal; `task.page("p1")` is the first Page.
- `page.goto(url)`, `page.title()`, `page.url()`, `page.snapshot()`.
- `page.click(selector)`, `page.fill(selector, value)`, and
  `page.selectOption(selector, value)` for forms.
- `page.keyboard.press(key)` to send a key such as Enter (use `action='press'`
  with `query` as the key, default Enter).
- `page.waitForSelector(selector)` for expected state; `page.evaluate(fn, arg)`
  for bulk extraction.
- `await task.finish({ keep: [] })` closes the space when the task succeeds.

Full API details live in the ego-browser skill (`~/.agents/skills/ego-browser/SKILL.md`).

## Example (post wire-up)
```bash
ego-browser nodejs <<'EOF'
const task = await taskSpace("check example site");
const page = task.page("p1");
await page.goto("https://example.com");
console.log(await page.title());
console.log(await page.snapshot());
await task.finish({ keep: [] });
EOF
```

## Safety rules (non-negotiable)
- Only http(s) URLs, and only information the master asked for; never private or
  unrelated data.
- Never delete files or modify the master's local project data.
- CAPTCHAs, logins, 2FA, OTPs, required form fields, and device prompts call
  `task.handOff()`: the window stays open under the master's control and pico
  asks via `ask_master` to have the master type the CAPTCHA and submit the form
  in the open browser, then resumes with `action='claim'` to read the result
  instead of guessing.
- Do not confirm one result through multiple surfaces; stop once the page shows
  the outcome.